<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Personal details form</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" required>
        <br><br>
        <label for="contact number">Contact Number:</label>
        <input type="text" id="contact number" name="contact number" required>
        <br><br>
        <label for="gender">gender:</label>
        <input type="radio" id="female" name="gender" value="female">female <br>
        <input type="radio" id="male" name="gender" value="male"> male
        <br><br>
        <label for="City">favorite city</label>
        <input type="checkbox" id="City" name="New Delhi" required> New delhi
        <input type="checkbox" id="City" name="Mumbai" required> Mumbai
        <input type="checkbox" id="City" name="Bangalore" required> Bangalore <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
